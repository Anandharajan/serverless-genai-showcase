name: Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: http://127.0.0.1:3000
  GENAI_LOCAL_ONLY: "1"
  SAM_CLI_TELEMETRY: "0"

jobs:
  run-smoke-test:
    name: Run local SAM demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          version: 1.120.0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build application
        run: sam build
      - name: Launch SAM local API
        run: |
          sam local start-api --env-vars infra/env.dev.json > sam-api.log 2>&1 &
          echo $! > sam.pid
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API failed to start" >&2
              cat sam-api.log
              exit 1
            fi
            sleep 5
          done
      - name: Run smoke test
        env:
          SMOKE_SKIP_DYNAMO: "1"
        run: python scripts/smoke_test.py $BASE_URL
      - name: Upload SAM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-sam-api-log
          path: sam-api.log
      - name: Stop SAM local API
        if: always()
        run: |
          if [ -f sam.pid ]; then
            kill $(cat sam.pid) || true

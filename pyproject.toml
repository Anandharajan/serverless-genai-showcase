[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serverless-genai-showcase"
version = "0.1.0"
description = "Serverless Generative AI showcase using AWS SAM"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "cfn-lint>=0.85.0",
    "requests>=2.32.0",
]

[tool.setuptools]
packages = ["services"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "tests"]

[tool.pytest.ini_options]
pythonpath = [
    "services",
]
addopts = "-q"
